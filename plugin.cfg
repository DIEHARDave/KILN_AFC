# KILN_AFC: ArmoredTurtle's AFC-Klipper-Add-On on Kiln OS, with the AD5X IFS
# as an AFC unit (afc_ifs/AFC_IFS.py). See README.md.
#
# Kiln includes this file while the plugin is enabled, and plugin updates
# replace it. To change an option, add the same section with your option to
# local.cfg; Klipper merges both sections, and yours win.
#
# Kiln does the filament work: IFS_LOAD, IFS_UNLOAD and IFS_SWAP cut, feed,
# heat and purge. AFC's own cut, park, poop, kick, wipe, tip forming and
# z_hop are therefore off.

# Bootstrap: lets Klipper find AFC's modules in this plugin (kiln_afc.py)
[kiln_afc]

[AFC]
VarFile: /home/klipper/printer_data/config/AFC/AFC.var
default_material_temps: default: 220, PLA:220, PETG:240, ABS:250, ASA:250, TPU:230
load_to_hub: False
assisted_unload: False
enable_sensors_in_gui: False
z_hop: 0
tool_cut: False
park: False
poop: False
kick: False
wipe: False
form_tip: False
# Kiln's T0-T3 macros become _T0-_T3; T0-T3 call AFC's CHANGE_TOOL
force_assign_map: True
# Several T(n) per lane: Kiln can map two tools to one slot (AFC_IFS
# follow_tool_map replays Kiln's map with SET_MAP)
enable_multiple_mapping: True

[AFC_prep]
enable: True

[delayed_gcode afc_welcome]
initial_duration: 2
gcode:
    PREP

[AFC_extruder extruder]
# The AD5X head sensor is an ADC sensor of Kiln's
# ([adc_filament_sensor toolhead]); AFC_IFS mirrors it as tool_start_state.

[AFC_hub IFS]
switch_pin: virtual
afc_bowden_length: 1000

[AFC_IFS IFS]
hub: IFS
extruder: extruder

[AFC_lane lane1]
unit: IFS:1
map: T0

[AFC_lane lane2]
unit: IFS:2
map: T1

[AFC_lane lane3]
unit: IFS:3
map: T2

[AFC_lane lane4]
unit: IFS:4
map: T3
