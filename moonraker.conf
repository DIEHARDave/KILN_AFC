# KILN_AFC's Moonraker part (Kiln OS includes it while the plugin is on):
# updates from Mainsail or Fluidd (Software Updates), release tags only.
# After an update, run RESTART: the plugin then loads the new code and
# brings its AFC checkout to the AFC commit the release was tested with
# (AFC_COMMIT). No managed_services: Kiln's Moonraker can't restart
# services (provider: none), so the update would end in an error.
[update_manager kiln-afc]
type: git_repo
channel: stable
path: /data/ad5x/plugins/afc
origin: https://github.com/DIEHARDave/KILN_AFC.git
primary_branch: master
is_system_service: False
